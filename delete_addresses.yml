---
- name: Delete FortiGate Address Objects
  hosts: fortigates
  gather_facts: false
  serial: 1

  vars:
    fortigate_username: admin
    fortigate_ssh_port: 22

  vars_files:
    - vars/var_delete_objects.yml

  vars_prompt:
    - name: fortigate_password
      prompt: "Enter the shared FortiGate SSH password"
      private: yes

  tasks:

    - name: Verify object list
      ansible.builtin.assert:
        that:
          - fortigate_address_objects is defined
          - fortigate_address_objects | length > 0
        fail_msg: "No address objects found in vars/var_delete_objects.yml"

    - name: Build FortiGate CLI
      ansible.builtin.set_fact:
        fortigate_cli_config: |
          config firewall address
          {% for obj in fortigate_address_objects %}
              delete "{{ obj }}"
          {% endfor %}
          end

    - name: Delete address objects
      ansible.builtin.command:
        argv:
          - sshpass
          - -e
          - ssh
          - -T
          - -p
          - "{{ fortigate_ssh_port | string }}"
          - -o
          - StrictHostKeyChecking=accept-new
          - -o
          - ConnectTimeout=15
          - -o
          - PreferredAuthentications=password
          - -o
          - PubkeyAuthentication=no
          - "{{ fortigate_username }}@{{ ansible_host }}"
        stdin: "{{ fortigate_cli_config }}"
      environment:
        SSHPASS: "{{ fortigate_password }}"
      delegate_to: localhost
      register: result
      changed_when: result.rc == 0
      failed_when: result.rc != 0
      no_log: false

    - name: Display results
      ansible.builtin.debug:
        msg: >-
          Deleted {{ fortigate_address_objects | join(', ') }}
          from {{ inventory_hostname }}
