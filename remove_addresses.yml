---
- name: Remove FortiGate address objects from an address group
  hosts: fortigates
  gather_facts: false
  serial: 1

  vars_files:
    - vars/var_remove_objects.yml

  vars_prompt:
    - name: fortigate_password
      prompt: Enter the shared FortiGate SSH password
      private: true

  tasks:
    - name: Validate required FortiGate variables
      ansible.builtin.assert:
        that:
          - fortigate_username is defined
          - fortigate_username | length > 0
          - fortigate_address_group is defined
          - fortigate_address_group | length > 0
          - fortigate_objects_to_remove is defined
          - fortigate_objects_to_remove | length > 0
        fail_msg: >-
          Required variables are missing from vars/fortigate.yml.
          Define fortigate_username, fortigate_address_group,
          and fortigate_objects_to_remove.

    - name: Build FortiGate CLI configuration
      ansible.builtin.set_fact:
        fortigate_cli_config: |
          config firewall addrgrp
              edit "{{ fortigate_address_group }}"
          {% for object_name in fortigate_objects_to_remove %}
                  unselect member "{{ object_name }}"
          {% endfor %}
              next
          end

    - name: Remove address objects from address group
      ansible.builtin.command:
        argv:
          - sshpass
          - -e
          - ssh
          - -T
          - -p
          - "{{ fortigate_ssh_port | default(22) | string }}"
          - -o
          - StrictHostKeyChecking=accept-new
          - -o
          - ConnectTimeout=15
          - -o
          - PreferredAuthentications=password
          - -o
          - PubkeyAuthentication=no
          - "{{ fortigate_username }}@{{ ansible_host }}"
        stdin: "{{ fortigate_cli_config }}"
      environment:
        SSHPASS: "{{ fortigate_password }}"
      delegate_to: localhost
      register: fortigate_result
      changed_when: fortigate_result.rc == 0
      failed_when: fortigate_result.rc != 0
      no_log: true

    - name: Report successful removal
      ansible.builtin.debug:
        msg: >-
          Removed {{ fortigate_objects_to_remove | join(', ') }}
          from address group '{{ fortigate_address_group }}'
          on {{ inventory_hostname }}.
